[tox]
envlist = {py12,py14}-dj{50,51,52}
skipdist = true
isolated_build = True
setenv =
    PYTHONDONTWRITEBYTECODE=true

[testenv]
deps =
    pytest
    pytest-django
    pytest-flake8
    factory-boy~=2.12.0
    dj50: Django~=5.0.0
    dj51: Django~=5.1.0
    dj52: Django~=5.2.0
extras =
    drf
setenv =
    DJANGO_SETTINGS_MODULE=email_user.tests.settings
usedevelop = true
changedir = {toxinidir}
commands =
    python -m pytest -s -Wall -Werror -Wd -q --tb=short
    django-admin check

[pytest]
django_find_project = false


[flake8]
max-line-length = 120
ignore =
    E501 email_user/migrations/*.py
