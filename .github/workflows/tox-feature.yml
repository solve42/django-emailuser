name: Tox (PRs)

on:
  pull_request:
    branches:
      - "main"
      - "dev"
    types: [opened, reopened, synchronize]

jobs:
  tox:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.base.ref == 'main' ||
      (github.event.pull_request.base.ref == 'dev' &&
       startsWith(github.event.pull_request.head.ref, 'feature/'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            toxenv: "py12-dj50"
          - python: "3.12"
            toxenv: "py12-dj51"
          - python: "3.12"
            toxenv: "py12-dj52"
    env:
      TOXENV: ${{ matrix.toxenv }}
      PYTEST_ADDOPTS: --junitxml=reports/junit-${{ matrix.toxenv }}.xml
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install tox
        run: python -m pip install --upgrade pip tox

      - name: Run tox
        run: python -m tox

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.toxenv }}
          path: reports/junit-${{ matrix.toxenv }}.xml
